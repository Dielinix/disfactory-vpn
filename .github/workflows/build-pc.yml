name: Build DISFACTORY VPN PC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download sing-box and Wintun binaries for Windows
        shell: bash
        run: |
          mkdir -p bin
          curl -L -o sing-box.zip "https://github.com/SagerNet/sing-box/releases/download/v1.10.7/sing-box-1.10.7-windows-amd64.zip"
          powershell -NoProfile -Command "Expand-Archive -Path sing-box.zip -DestinationPath sb_tmp -Force"
          cp sb_tmp/*/sing-box.exe bin/

          curl -L -o wintun.zip "https://www.wintun.net/builds/wintun-0.14.1.zip"
          powershell -NoProfile -Command "Expand-Archive -Path wintun.zip -DestinationPath wt_tmp -Force"
          cp wt_tmp/wintun/bin/amd64/wintun.dll bin/

      - name: Prepare icon and Electron VPN wrapper
        shell: bash
        run: |
          mkdir -p build
          pip install pillow
          python -c "import os; from PIL import Image; src = 'icon.png' if os.path.exists('icon.png') else ('icon.jpg' if os.path.exists('icon.jpg') else ''); img = Image.open(src).convert('RGBA').resize((512, 512)) if src else None; img.save('build/icon.png') if img else None; img.save('icon.png') if img else None"

          cat << 'EOF' > preload.js
          const { contextBridge, ipcRenderer } = require('electron');

          contextBridge.exposeInMainWorld('disfactoryDesktopVpn', {
            connect: (payload) => ipcRenderer.invoke('vpn:connect', payload),
            disconnect: () => ipcRenderer.invoke('vpn:disconnect'),
            getTrafficStats: () => ipcRenderer.invoke('vpn:stats'),
            pingServer: (payload) => ipcRenderer.invoke('vpn:ping', payload),
            fetchSubscription: (payload) => ipcRenderer.invoke('vpn:fetchSub', payload),
            readClipboard: () => ipcRenderer.invoke('vpn:clipboard')
          });
          EOF

          cat << 'EOF' > main.js
          const { app, BrowserWindow, ipcMain, clipboard } = require('electron');
          const path = require('path');
          const fs = require('fs');
          const os = require('os');
          const crypto = require('crypto');
          const net = require('net');
          const http = require('http');
          const https = require('https');
          const { spawn } = require('child_process');

          let vpnProcess = null;

          function getBinDir() {
            const prodBin = path.join(process.resourcesPath, 'bin');
            return fs.existsSync(prodBin) ? prodBin : path.join(__dirname, 'bin');
          }

          function getDeviceHwid() {
            const hwidFile = path.join(app.getPath('userData'), 'device-hwid.txt');
            if (fs.existsSync(hwidFile)) {
              return fs.readFileSync(hwidFile, 'utf8').trim();
            }
            const raw = [os.hostname(), os.platform(), os.arch(), (os.cpus()[0] || {}).model || 'cpu'].join('|');
            const hwid = crypto.createHash('sha256').update(raw).digest('hex').slice(0, 32);
            fs.writeFileSync(hwidFile, hwid, 'utf8');
            return hwid;
          }

          function buildSingBoxConfig(uri) {
            const trimmed = (uri || '').trim();
            let outbound = null;
            let serverHost = '';

            if (trimmed.startsWith('vless://')) {
              const u = new URL(trimmed);
              serverHost = u.hostname;
              const port = parseInt(u.port, 10) || 443;
              const security = u.searchParams.get('security') || 'none';
              const sni = u.searchParams.get('sni') || serverHost;
              const fp = u.searchParams.get('fp') || 'chrome';
              const pbk = u.searchParams.get('pbk') || '';
              const sid = u.searchParams.get('sid') || '';
              const flow = u.searchParams.get('flow') || '';
              const netType = u.searchParams.get('type') || 'tcp';

              outbound = {
                type: 'vless',
                tag: 'proxy-out',
                server: serverHost,
                server_port: port,
                uuid: decodeURIComponent(u.username)
              };

              if (flow) outbound.flow = flow;

              if (security === 'reality' || security === 'tls') {
                outbound.tls = {
                  enabled: true,
                  server_name: sni,
                  utls: { enabled: true, fingerprint: fp }
                };
                if (security === 'reality') {
                  outbound.tls.reality = {
                    enabled: true,
                    public_key: pbk,
                    short_id: sid
                  };
                }
              }

              if (netType === 'ws') {
                outbound.transport = {
                  type: 'ws',
                  path: u.searchParams.get('path') || '/',
                  headers: { Host: u.searchParams.get('host') || sni }
                };
              } else if (netType === 'grpc') {
                outbound.transport = {
                  type: 'grpc',
                  service_name: u.searchParams.get('serviceName') || ''
                };
              }
            } else if (trimmed.startsWith('trojan://')) {
              const u = new URL(trimmed);
              serverHost = u.hostname;
              const port = parseInt(u.port, 10) || 443;
              const sni = u.searchParams.get('sni') || serverHost;
              const fp = u.searchParams.get('fp') || 'chrome';

              outbound = {
                type: 'trojan',
                tag: 'proxy-out',
                server: serverHost,
                server_port: port,
                password: decodeURIComponent(u.username),
                tls: {
                  enabled: true,
                  server_name: sni,
                  utls: { enabled: true, fingerprint: fp }
                }
              };
            } else if (trimmed.startsWith('ss://')) {
              const withoutHash = trimmed.split('#')[0];
              const rawBody = withoutHash.slice(5);
              let method = '';
              let password = '';
              let port = 443;

              if (rawBody.includes('@')) {
                const [userPart, hostPart] = rawBody.split('@');
                const decodedUser = Buffer.from(userPart, 'base64').toString('utf8');
                const sep = decodedUser.indexOf(':');
                method = decodedUser.slice(0, sep);
                password = decodedUser.slice(sep + 1);
                const lastColon = hostPart.lastIndexOf(':');
                serverHost = hostPart.slice(0, lastColon);
                port = parseInt(hostPart.slice(lastColon + 1), 10) || 443;
              } else {
                const decodedFull = Buffer.from(rawBody, 'base64').toString('utf8');
                const atIdx = decodedFull.lastIndexOf('@');
                const userPart = decodedFull.slice(0, atIdx);
                const hostPart = decodedFull.slice(atIdx + 1);
                const sep = userPart.indexOf(':');
                method = userPart.slice(0, sep);
                password = userPart.slice(sep + 1);
                const lastColon = hostPart.lastIndexOf(':');
                serverHost = hostPart.slice(0, lastColon);
                port = parseInt(hostPart.slice(lastColon + 1), 10) || 443;
              }

              outbound = {
                type: 'shadowsocks',
                tag: 'proxy-out',
                server: serverHost,
                server_port: port,
                method,
                password
              };
            } else if (trimmed.includes('[Interface]') && trimmed.includes('[Peer]')) {
              const data = {};
              trimmed.split(/\r?\n/).forEach(line => {
                const idx = line.indexOf('=');
                if (idx > -1) data[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
              });
              const addresses = (data.Address || '172.16.0.2/32').split(',').map(s => s.trim()).filter(Boolean);
              const endpoint = data.Endpoint || 'engage.cloudflareclient.com:2408';
              const lastColon = endpoint.lastIndexOf(':');
              serverHost = endpoint.slice(0, lastColon);
              const serverPort = parseInt(endpoint.slice(lastColon + 1), 10) || 2408;

              outbound = {
                type: 'wireguard',
                tag: 'proxy-out',
                server: serverHost,
                server_port: serverPort,
                local_address: addresses,
                private_key: data.PrivateKey,
                peer_public_key: data.PublicKey,
                mtu: parseInt(data.MTU || '1280', 10)
              };
            } else {
              throw new Error('Неподдерживаемый формат ключа');
            }

            return {
              log: { level: 'warn' },
              experimental: {
                clash_api: { external_controller: '127.0.0.1:19090' }
              },
              dns: {
                servers: [
                  { tag: 'remote-dns', address: '1.1.1.1', detour: 'proxy-out' },
                  { tag: 'local-dns', address: '223.5.5.5', detour: 'direct' }
                ]
              },
              inbounds: [
                {
                  type: 'tun',
                  tag: 'tun-in',
                  interface_name: 'disfactory-tun',
                  inet4_address: '172.19.0.1/30',
                  mtu: 1400,
                  auto_route: true,
                  strict_route: true,
                  stack: 'gvisor',
                  sniff: true
                }
              ],
              outbounds: [
                outbound,
                { type: 'direct', tag: 'direct' },
                { type: 'dns', tag: 'dns-out' }
              ],
              route: {
                rules: [
                  { protocol: 'dns', outbound: 'dns-out' },
                  { domain: [serverHost], outbound: 'direct' },
                  { ip_is_private: true, outbound: 'direct' }
                ],
                auto_detect_interface: true,
                final: 'proxy-out'
              }
            };
          }

          function stopVpnProcess() {
            if (vpnProcess) {
              try { vpnProcess.kill(); } catch (_) {}
              vpnProcess = null;
            }
          }

          ipcMain.handle('vpn:connect', async (_event, { uri }) => {
            stopVpnProcess();
            const binDir = getBinDir();
            const singBoxExe = path.join(binDir, 'sing-box.exe');
            const configPath = path.join(app.getPath('userData'), 'disfactory-active.json');

            const sbConfig = buildSingBoxConfig(uri);
            fs.writeFileSync(configPath, JSON.stringify(sbConfig, null, 2), 'utf8');

            return new Promise((resolve, reject) => {
              let settled = false;
              let stderrLog = '';

              const child = spawn(singBoxExe, ['run', '-c', configPath], {
                cwd: binDir,
                windowsHide: true
              });

              vpnProcess = child;
              child.stderr.on('data', chunk => { stderrLog += chunk.toString(); });
              child.on('exit', code => {
                if (!settled) {
                  settled = true;
                  vpnProcess = null;
                  reject(new Error(stderrLog || `Код выхода ${code}`));
                }
              });

              setTimeout(() => {
                if (!settled) {
                  settled = true;
                  resolve({ connected: true });
                }
              }, 800);
            });
          });

          ipcMain.handle('vpn:disconnect', async () => {
            stopVpnProcess();
            return { connected: false };
          });

          ipcMain.handle('vpn:stats', async () => {
            if (!vpnProcess) return { rxBytes: 0, txBytes: 0 };
            return new Promise((resolve) => {
              const req = http.get('http://127.0.0.1:19090/connections', (res) => {
                let raw = '';
                res.on('data', chunk => { raw += chunk; });
                res.on('end', () => {
                  try {
                    const parsed = JSON.parse(raw);
                    resolve({ rxBytes: parsed.downloadTotal || 0, txBytes: parsed.uploadTotal || 0 });
                  } catch (_) {
                    resolve({ rxBytes: 0, txBytes: 0 });
                  }
                });
              });
              req.on('error', () => resolve({ rxBytes: 0, txBytes: 0 }));
              req.setTimeout(400, () => { req.destroy(); resolve({ rxBytes: 0, txBytes: 0 }); });
            });
          });

          ipcMain.handle('vpn:ping', async (_event, { host, port }) => {
            return new Promise((resolve) => {
              const start = Date.now();
              const socket = new net.Socket();
              let done = false;

              const finish = (ms) => {
                if (done) return;
                done = true;
                socket.destroy();
                resolve({ ping: ms });
              };

              socket.setTimeout(3000);
              socket.connect(port || 443, host, () => finish(Math.max(1, Date.now() - start)));
              socket.on('error', () => finish(-1));
              socket.on('timeout', () => finish(-1));
            });
          });

          function fetchWithRedirects(targetUrl, customHeaders, redirectsLeft = 5) {
            return new Promise((resolve, reject) => {
              const client = targetUrl.startsWith('https') ? https : http;
              const req = client.get(targetUrl, { headers: customHeaders }, (res) => {
                if ([301, 302, 303, 307, 308].includes(res.statusCode) && res.headers.location && redirectsLeft > 0) {
                  const nextUrl = new URL(res.headers.location, targetUrl).toString();
                  res.resume();
                  resolve(fetchWithRedirects(nextUrl, customHeaders, redirectsLeft - 1));
                  return;
                }
                let data = '';
                res.on('data', chunk => { data += chunk; });
                res.on('end', () => resolve({ body: data, headers: res.headers }));
              });
              req.on('error', (err) => reject(err));
              req.setTimeout(9000, () => { req.destroy(); reject(new Error('Таймаут подписки')); });
            });
          }

          function isStubResponse(bodyText) {
            let decoded = (bodyText || '').trim();
            if (!decoded) return true;
            if (!decoded.includes('://')) {
              try {
                decoded = Buffer.from(decoded.replace(/-/g, '+').replace(/_/g, '/'), 'base64').toString('utf8');
              } catch (_) {}
            }
            return decoded.includes('@0.0.0.0:1') || decoded.includes('@127.0.0.1:1');
          }

          ipcMain.handle('vpn:fetchSub', async (_event, { url }) => {
            const hwid = getDeviceHwid();
            const profiles = [
              {
                'User-Agent': 'Happ/2.6.1',
                'x-hwid': hwid,
                'x-device-os': 'Windows',
                'x-ver-os': os.release(),
                'x-device-model': 'Desktop PC',
                'Accept': '*/*'
              },
              {
                'User-Agent': 'v2rayNG/1.9.15',
                'Accept': '*/*'
              },
              {
                'User-Agent': 'HiddifyNext/2.5.7 (windows)',
                'x-hwid': hwid,
                'Accept': '*/*'
              }
            ];

            let lastResult = null;
            for (const headers of profiles) {
              try {
                const res = await fetchWithRedirects(url, headers);
                lastResult = res;
                if (!isStubResponse(res.body)) {
                  return res;
                }
              } catch (_) {}
            }

            if (lastResult) return lastResult;
            throw new Error('Не удалось загрузить подписку');
          });

          ipcMain.handle('vpn:clipboard', () => clipboard.readText());

          function createWindow() {
            const iconPath = path.join(__dirname, 'icon.png');
            const win = new BrowserWindow({
              width: 430,
              height: 800,
              show: false,
              resizable: false,
              maximizable: false,
              autoHideMenuBar: true,
              backgroundColor: '#020203',
              title: 'DISFACTORY VPN',
              icon: fs.existsSync(iconPath) ? iconPath : undefined,
              webPreferences: {
                preload: path.join(__dirname, 'preload.js'),
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            win.once('ready-to-show', () => win.show());
            win.loadFile(path.join(__dirname, 'index.html'));
          }

          app.whenReady().then(createWindow);
          app.on('before-quit', stopVpnProcess);
          app.on('window-all-closed', () => {
            stopVpnProcess();
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

          cat << 'EOF' > package.json
          {
            "name": "disfactory-vpn",
            "version": "1.1.0",
            "description": "DISFACTORY VPN Desktop Client",
            "main": "main.js",
            "build": {
              "appId": "com.disfactory.vpn",
              "productName": "DISFACTORY VPN",
              "files": [
                "main.js",
                "preload.js",
                "index.html",
                "style.css",
                "app.js",
                "icon.png"
              ],
              "extraResources": [
                {
                  "from": "bin",
                  "to": "bin"
                }
              ],
              "win": {
                "target": "dir",
                "requestedExecutionLevel": "requireAdministrator"
              }
            }
          }
          EOF

      - name: Install Electron and build fast unpacked app
        shell: bash
        run: |
          npm install --save-dev electron electron-builder
          npx electron-builder --win dir

      - name: Upload Windows App artifact
        uses: actions/upload-artifact@v4
        with:
          name: DISFACTORY-VPN-Windows
          path: dist/win-unpacked/
